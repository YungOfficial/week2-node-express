<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">Medium</div>
        
        <nav class="nav-desktop">
            <a href="#">Our story</a>
            <a href="#">Membership</a>
            <a href="#">Write</a>
            <a href="#">Sign in</a>
            <button class="btn">Get started</button>
        </nav>

        <button class="btn btn-mobile">Get started</button>
    </header>

    <!-- HERO SECTION -->
    <main class="hero">
        <div class="hero-text">
            <h1>Human<br>stories &<br>ideas</h1>
            <p>A place to read, write, and deepen your understanding</p>
            <button class="btn-green">Start reading</button>
            <button class="btn-black">Start reading</button>
        </div>
        <div class="hero-image">
            <!-- INLINE SVG FLOWER -->
            <svg width="300" height="300" viewBox="0 0 100 100" xmlns=" ">
                <!-- Stem -->
                <line x1="50" y1="100" x2="50" y2="40" stroke="#1a8917" stroke-width="3"/>
                <!-- Leaves -->
                <ellipse cx="40" cy="60" rx="8" ry="15" fill="#1a8917" transform="rotate(-30 40 60)"/>
                <ellipse cx="60" cy="60" rx="8" ry="15" fill="#1a8917" transform="rotate(30 60 60)"/>
                <!-- Flower petals -->
                <circle cx="50" cy="20" r="12" fill="#1a8917"/>
                <circle cx="35" cy="30" r="12" fill="#1a8917"/>
                <circle cx="65" cy="30" r="12" fill="#1a8917"/>
                <circle cx="30" cy="45" r="12" fill="#1a8917"/>
                <circle cx="70" cy="45" r="12" fill="#1a8917"/>
                <circle cx="35" cy="60" r="12" fill="#1a8917"/>
                <circle cx="65" cy="60" r="12" fill="#1a8917"/>
                <circle cx="50" cy="65" r="12" fill="#1a8917"/>
                <!-- Center -->
                <circle cx="50" cy="45" r="10" fill="#faf8f3"/>
            </svg>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <ul class="footer-links">
            <li><a href="#" target="_blank">Help</a></li>
            <li class="hide-mobile"><a href="#" target="_blank">Status</a></li>
            <li><a href="#" target="_blank">About</a></li>
            <li class="hide-mobile"><a href="#" target="_blank">Careers</a></li>
            <li class="hide-mobile"><a href="#" target="_blank">Press</a></li>
            <li class="hide-mobile"><a href="#" target="_blank">Blog</a></li>
            <li class="hide-mobile"><a href="#" target="_blank">Store</a></li>
            <li><a href="#" target="_blank">Privacy</a></li>
            <li class="hide-mobile"><a href="#" target="_blank">Rules</a></li>
            <li><a href="#" target="_blank">Terms</a></li>
            <li class="hide-mobile"><a href="#" target="_blank">Text to speech</a></li>
        </ul>
    </footer>

</body>
</html>
