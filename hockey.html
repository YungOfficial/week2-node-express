<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Air Hockey Game</title>
</head>
<body style="margin:0; padding:0; background:#0a0a1a; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; font-family:Arial, sans-serif; overflow:hidden; touch-action:none;">

<div style="background:#000; border:2px solid #00f0ff; border-radius:20px; box-shadow:0 0 30px #00f0ff55; padding:20px; position:relative;">

    <div style="display:flex; justify-content:space-between; color:#fff; margin-bottom:10px; font-size:20px; font-weight:bold;">
        <div style="color:#00f0ff;">YOU: <span id="playerScore">0</span></div>
        <div style="color:#ff0040;">CPU: <span id="cpuScore">0</span></div>
    </div>

    <canvas id="gameCanvas" width="600" height="400" style="background:radial-gradient(circle at center, #001428 0%, #000 100%); border:3px solid #00f0ff; border-radius:15px; display:block;"></canvas>

    <!-- Countdown Overlay -->
    <div id="countdown" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:72px; color:#00f0ff; font-weight:bold; display:none; text-shadow:0 0 20px #00f0ff;">3</div>

    <!-- Rotary Joystick UNDER the game -->
    <div id="joystickBase" style="width:120px; height:120px; border:3px solid #00f0ff; border-radius:50%; margin:15px auto 0; background:rgba(0,240,255,0.1); position:relative;">
        <div id="joystickKnob" style="width:40px; height:40px; background:#00f0ff; border-radius:50%; position:absolute; top:40px; left:40px; box-shadow:0 0 15px #00f0ff;"></div>
    </div>
</div>

<div id="winScreen" style="position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); display:none; justify-content:center; align-items:center; flex-direction:column; color:#fff; font-size:36px; font-weight:bold; z-index:10;">
    <div id="winText">YOU WIN!</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const playerScoreEl = document.getElementById('playerScore');
const cpuScoreEl = document.getElementById('cpuScore');
const winScreen = document.getElementById('winScreen');
const winText = document.getElementById('winText');
const joystickBase = document.getElementById('joystickBase');
const joystickKnob = document.getElementById('joystickKnob');
const countdownEl = document.getElementById('countdown');

let audioCtx;
let gameRunning = false; // start paused for countdown

// Settings
const GOAL_HEIGHT = 100;
const WIN_SCORE = 5;
const JOY_RADIUS = 40;
const GOAL_WIDTH = 10;

// Game objects
const puck = { x: canvas.width/2, y: canvas.height/2, r: 12, vx: 0, vy: 0, speed: 6 };
const player = { x: 80, y: canvas.height/2, r: 20, speed: 7 };
const cpu = { x: canvas.width - 80, y: canvas.height/2, r: 20, speed: 5 };

let playerScore = 0;
let cpuScore = 0;
let joyVector = { x: 0, y: 0 };
let joystickActive = false;
let nextServer = 'random';

// Audio
function getAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
function playSound(type, speed = 1) {
    const ctx = getAudio(); const t = ctx.currentTime; const out = ctx.destination;
    if (type === "hit") {
        const n = ctx.createBufferSource(); const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.07, ctx.sampleRate);
        const data = buffer.getChannelData(0); for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        n.buffer = buffer; const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 900 + speed * 180;
        const g = ctx.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        n.connect(bp); bp.connect(g); g.connect(out); n.start(t); n.stop(t + 0.07);
    }
    if (type === "goal") {
        const o = ctx.createOscillator(); const g = ctx.createGain(); o.type = "sine";
        o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(100, t + 0.3);
        g.gain.setValueAtTime(0.4, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.3);
    }
}

// Rotary Joystick
function handleJoystick(e) {
    const rect = joystickBase.getBoundingClientRect();
    const centerX = rect.left + rect.width/2; const centerY = rect.top + rect.height/2;
    const clientX = e.touches? e.touches[0].clientX : e.clientX;
    const clientY = e.touches? e.touches[0].clientY : e.clientY;
    let dx = clientX - centerX; let dy = clientY - centerY;
    let dist = Math.sqrt(dx*dx + dy*dy);
    if(dist > JOY_RADIUS) { dx = dx * JOY_RADIUS / dist; dy = dy * JOY_RADIUS / dist; dist = JOY_RADIUS; }
    joystickKnob.style.left = (60 + dx - 20) + 'px';
    joystickKnob.style.top = (60 + dy - 20) + 'px';
    joyVector.x = dx / JOY_RADIUS; joyVector.y = dy / JOY_RADIUS;
}
joystickBase.addEventListener('touchstart', () => joystickActive = true);
joystickBase.addEventListener('mousedown', () => joystickActive = true);
joystickBase.addEventListener('touchmove', handleJoystick);
joystickBase.addEventListener('mousemove', (e) => { if(joystickActive) handleJoystick(e) });
joystickBase.addEventListener('touchend', () => { joystickActive = false; joyVector = {x:0,y:0}; joystickKnob.style.left='40px'; joystickKnob.style.top='40px'; });
joystickBase.addEventListener('mouseup', () => { joystickActive = false; joyVector = {x:0,y:0}; joystickKnob.style.left='40px'; joystickKnob.style.top='40px'; });

function countdownAndServe(server) {
    gameRunning = false;
    let count = 3;
    countdownEl.style.display = 'block';
    countdownEl.textContent = count;

    const interval = setInterval(() => {
        count--;
        if(count > 0) {
            countdownEl.textContent = count;
            playSound("hit", 0.3);
        } else {
            clearInterval(interval);
            countdownEl.style.display = 'none';
            gameRunning = true;

            // Serve the puck
            let serveDir;
            if(server === 'random') serveDir = Math.random() > 0.5? 1 : -1;
            else if(server === 'player') serveDir = 1;
            else serveDir = -1;

            puck.x = canvas.width/2;
            puck.y = canvas.height/2;
            puck.vx = serveDir * puck.speed;
            puck.vy = (Math.random() * 2 - 1) * puck.speed * 0.5;
        }
    }, 1000);
}

function checkWin() {
    if(playerScore >= WIN_SCORE || cpuScore >= WIN_SCORE) {
        winText.textContent = playerScore >= WIN_SCORE? "YOU WIN! 🎉" : "CPU WINS! 🤖";
        winScreen.style.display = "flex"; gameRunning = false;
        setTimeout(() => {
            playerScore = 0; cpuScore = 0;
            playerScoreEl.textContent = 0; cpuScoreEl.textContent = 0;
            winScreen.style.display = "none";
            nextServer = 'random';
            countdownAndServe(nextServer);
        }, 2000);
    }
}

function checkGoal() {
    const goalYTop = canvas.height/2 - GOAL_HEIGHT/2;
    const goalYBottom = canvas.height/2 + GOAL_HEIGHT/2;

    // FIXED: Check if puck center crosses the goal line
    if (puck.x < 0 && puck.y > goalYTop && puck.y < goalYBottom) {
        cpuScore++; cpuScoreEl.textContent = cpuScore; playSound("goal");
        nextServer = 'player';
        countdownAndServe(nextServer); checkWin(); return true;
    }
    if (puck.x > canvas.width && puck.y > goalYTop && puck.y < goalYBottom) {
        playerScore++; playerScoreEl.textContent = playerScore; playSound("goal");
        nextServer = 'cpu';
        countdownAndServe(nextServer); checkWin(); return true;
    }
    return false;
}

function pushApart(a, b) {
    let dx = a.x - b.x; let dy = a.y - b.y; let dist = Math.sqrt(dx*dx + dy*dy); let minDist = a.r + b.r;
    if(dist < minDist && dist > 0) {
        let overlap = minDist - dist; let nx = dx / dist; let ny = dy / dist;
        a.x += nx * overlap/2; a.y += ny * overlap/2;
        b.x -= nx * overlap/2; b.y -= ny * overlap/2;
    }
}

function update() {
    if(!gameRunning) return;

    player.x += joyVector.x * player.speed;
    player.y += joyVector.y * player.speed;
    player.x = Math.max(player.r, Math.min(canvas.width/2 - player.r, player.x));
    player.y = Math.max(player.r, Math.min(canvas.height - player.r, player.y));

    let cpuDx = puck.x - cpu.x; let cpuDy = puck.y - cpu.y;
    cpu.x += cpuDx * 0.05 * (cpu.speed/5);
    cpu.y += cpuDy * 0.05 * (cpu.speed/5);
    cpu.x = Math.max(canvas.width/2 + cpu.r, Math.min(canvas.width - cpu.r, cpu.x));
    cpu.y = Math.max(cpu.r, Math.min(canvas.height - cpu.r, cpu.y));

    puck.x += puck.vx; puck.y += puck.vy;
    puck.vx *= 0.99; puck.vy *= 0.99;

    puck.x = Math.max(puck.r, Math.min(canvas.width - puck.r, puck.x));
    puck.y = Math.max(puck.r, Math.min(canvas.height - puck.r, puck.y));

    if (puck.y - puck.r <= 0 || puck.y + puck.r >= canvas.height) {
        puck.vy *= -1; playSound("hit", 0.5);
    }
    const goalYTop = canvas.height/2 - GOAL_HEIGHT/2;
    const goalYBottom = canvas.height/2 + GOAL_HEIGHT/2;
    // FIXED: Only bounce if NOT in goal area
    if (puck.x - puck.r <= 0 && (puck.y < goalYTop || puck.y > goalYBottom)) {
        puck.vx *= -1; playSound("hit", 0.5);
    }
    if (puck.x + puck.r >= canvas.width && (puck.y < goalYTop || puck.y > goalYBottom)) {
        puck.vx *= -1; playSound("hit", 0.5);
    }

    if(!checkGoal()) {
        function collide(p) {
            let dx = puck.x - p.x; let dy = puck.y - p.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < puck.r + p.r) {
                let angle = Math.atan2(dy, dx);
                let speed = Math.sqrt(puck.vx*puck.vx + puck.vy*puck.vy) + 2;
                puck.vx = Math.cos(angle) * speed;
                puck.vy = Math.sin(angle) * speed;
                pushApart(puck, p); playSound("hit", speed/6);
            }
        }
        collide(player); collide(cpu); pushApart(player, cpu);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const goalYTop = canvas.height/2 - GOAL_HEIGHT/2;
    const goalYBottom = canvas.height/2 + GOAL_HEIGHT/2;

    ctx.strokeStyle = '#00f0ff44'; ctx.setLineDash([10, 10]);
    ctx.beginPath(); ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, 50, 0, Math.PI*2); ctx.strokeStyle = '#00f0ff44'; ctx.stroke();

    // FIXED: Draw goal posts only above/below the goal, not blocking it
    ctx.strokeStyle = '#ff0040'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, goalYTop); ctx.stroke(); // top left
    ctx.beginPath(); ctx.moveTo(0, goalYBottom); ctx.lineTo(0, canvas.height); ctx.stroke(); // bottom left
    ctx.strokeStyle = '#00f0ff';
    ctx.beginPath(); ctx.moveTo(canvas.width, 0); ctx.lineTo(canvas.width, goalYTop); ctx.stroke(); // top right
    ctx.beginPath(); ctx.moveTo(canvas.width, goalYBottom); ctx.lineTo(canvas.width, canvas.height); ctx.stroke(); // bottom right
    ctx.lineWidth = 1;

    ctx.beginPath(); ctx.arc(puck.x, puck.y, puck.r, 0, Math.PI*2);
    ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 15; ctx.shadowColor = '#fff'; ctx.fill(); ctx.shadowBlur = 0;

    ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
    ctx.fillStyle = '#00f0ff'; ctx.shadowBlur = 15; ctx.shadowColor = '#00f0ff'; ctx.fill();

    ctx.beginPath(); ctx.arc(cpu.x, cpu.y, cpu.r, 0, Math.PI*2);
    ctx.fillStyle = '#ff0040'; ctx.shadowBlur = 15; ctx.shadowColor = '#ff0040'; ctx.fill(); ctx.shadowBlur = 0;
}

countdownAndServe('random'); // start with countdown
function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
gameLoop();
</script>
</body>
</html>
